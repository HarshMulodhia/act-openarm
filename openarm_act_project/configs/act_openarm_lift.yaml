# Configuration for ACT policy training on the OpenArm unimanual lift task.
# All paths are relative to the openarm_act_project/ directory unless absolute.

task: Isaac-Lift-Cube-OpenArm-v0
task_name: openarm_lift

# ---------------------------------------------------------------------------
# Demonstration collection
# ---------------------------------------------------------------------------
collection:
  num_episodes: 300
  dataset_dir: data/demos_hdf5/openarm_lift
  step_hz: 30
  expert_source: dagger      # rsl_rl | keyboard | dagger
  expert_checkpoint: null    # required for rsl_rl unless use_pretrained_checkpoint is true
  use_pretrained_checkpoint: false
  teleop_device: keyboard
  num_success_steps: 10
  max_timesteps: 600
  success_distance_threshold: 0.03
  dagger:
    student_checkpoint_dir: checkpoints/openarm_lift_act
    beta: 0.5
  noise:
    enabled: true
    gaussian_std: 0.01
    sinusoidal_amplitude: 0.005
    sinusoidal_period_steps: 60
    seed: 42

augmentation:
  enabled: true
  source_dataset_dir: data/demos_hdf5/openarm_lift
  output_dataset_dir: data/demos_hdf5/openarm_lift_noise_gaussian_001
  noise_type: gaussian
  gaussian_std: 0.01
  sinusoidal_amplitude: 0.01
  sinusoidal_period_steps: 60
  seed: 42
  clip_to_source_range: false

# ---------------------------------------------------------------------------
# ACT model architecture
# ---------------------------------------------------------------------------
model:
  policy_class: ACT
  chunk_size: 100
  kl_weight: 10
  hidden_dim: 512
  dim_feedforward: 3200
  nheads: 8
  num_encoder_layers: 4
  num_queries: 100
  backbone: resnet18
  no_encoder: false

# ---------------------------------------------------------------------------
# Observation space
# ---------------------------------------------------------------------------
observation:
  camera_names:
    - cam_main
  image_height: 480
  image_width: 640
  num_joints: 7

# ---------------------------------------------------------------------------
# Training
# ---------------------------------------------------------------------------
training:
  seed: 42
  algorithm: dagger          # bc | dagger
  dataset_mode: clean_plus_noise
  clean_dataset_dir: data/demos_hdf5/openarm_lift
  noise_dataset_dir: data/demos_hdf5/openarm_lift_noise_gaussian_001
  num_epochs: 3000
  batch_size: 8
  lr: 1.0e-5
  weight_decay: 1.0e-4
  lr_backbone: 1.0e-5
  checkpoint_dir: checkpoints/openarm_lift_act
  save_every: 100
  eval_every: 500
  num_workers: 4

# ---------------------------------------------------------------------------
# Evaluation
# ---------------------------------------------------------------------------
evaluation:
  num_rollouts: 50
  max_timesteps: 600
  temporal_agg: false
  onscreen_render: false
