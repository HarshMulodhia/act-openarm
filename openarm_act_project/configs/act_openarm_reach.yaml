# Configuration for ACT policy training on the OpenArm unimanual reach task.
# All paths are relative to the openarm_act_project/ directory unless absolute.

task: Isaac-Reach-OpenArm-v0
task_name: openarm_reach

# ---------------------------------------------------------------------------
# Demonstration collection
# ---------------------------------------------------------------------------
collection:
  num_episodes: 200
  dataset_dir: data/demos_hdf5/openarm_reach
  step_hz: 30
  expert_source: rsl_rl      # rsl_rl | keyboard
  expert_checkpoint: null    # required for rsl_rl unless use_pretrained_checkpoint is true
  use_pretrained_checkpoint: false
  teleop_device: keyboard    # used only when expert_source is keyboard
  num_success_steps: 10     # consecutive success steps to mark an episode done
  max_timesteps: 400
  success_distance_threshold: 0.03

augmentation:
  enabled: false
  source_dataset_dir: data/demos_hdf5/openarm_reach
  output_dataset_dir: data/demos_hdf5/openarm_reach_noise_gaussian_001
  noise_type: gaussian       # gaussian | sinusoidal
  gaussian_std: 0.01         # recommended default; use 0.03 for stronger ablation
  sinusoidal_amplitude: 0.01
  sinusoidal_period_steps: 60
  seed: 42
  clip_to_source_range: false

# ---------------------------------------------------------------------------
# ACT model architecture
# ---------------------------------------------------------------------------
model:
  policy_class: ACT
  chunk_size: 100           # action chunk length (k)
  kl_weight: 10             # beta in KL divergence term
  hidden_dim: 512
  dim_feedforward: 3200
  nheads: 8
  num_encoder_layers: 4
  num_queries: 100          # must equal chunk_size
  backbone: resnet18
  no_encoder: false

# ---------------------------------------------------------------------------
# Observation space
# ---------------------------------------------------------------------------
observation:
  camera_names:
    - cam_main
  training_camera_names:
    - cam_main
  render_camera_names:
    - isometric
    - front
    - top
  image_height: 480
  image_width: 640
  num_joints: 7             # actuated arm joints in the OpenArm task
  camera_setup:
    cam_main:
      type: robot
      prim_path: "{ENV_REGEX_NS}/Robot/openarm_hand/cam_main"
      height: 480
      width: 640
      update_period: 0.0333
      focal_length: 18.0
      offset_pos: [0.04, 0.0, 0.02]
      offset_rot: [0.5, -0.5, 0.5, -0.5]
    isometric:
      type: scene
      prim_path: "{ENV_REGEX_NS}/isometric_camera"
      height: 1080
      width: 1920
      update_period: 0.0333
      focal_length: 24.0
      offset_pos: [1.8, -1.8, 1.2]
      offset_rot: [0.3536, -0.1464, 0.3536, -0.8536]
    front:
      type: scene
      prim_path: "{ENV_REGEX_NS}/front_camera"
      height: 1080
      width: 1920
      update_period: 0.0333
      focal_length: 24.0
      offset_pos: [1.3, 0.0, 0.55]
      offset_rot: [0.5, -0.5, 0.5, -0.5]
    top:
      type: scene
      prim_path: "{ENV_REGEX_NS}/top_camera"
      height: 1080
      width: 1920
      update_period: 0.0333
      focal_length: 24.0
      offset_pos: [0.45, 0.0, 1.8]
      offset_rot: [0.0, 0.7071, 0.7071, 0.0]

# ---------------------------------------------------------------------------
# Training
# ---------------------------------------------------------------------------
training:
  seed: 42
  dataset_mode: clean        # clean | clean_plus_noise | noise
  clean_dataset_dir: data/demos_hdf5/openarm_reach
  noise_dataset_dir: data/demos_hdf5/openarm_reach_noise_gaussian_001
  num_epochs: 2000
  batch_size: 8
  lr: 1.0e-5
  weight_decay: 1.0e-4
  lr_backbone: 1.0e-5
  checkpoint_dir: checkpoints/openarm_reach_act
  save_every: 100           # save checkpoint every N epochs
  eval_every: 500           # run evaluation every N epochs
  num_workers: 4

# ---------------------------------------------------------------------------
# Evaluation
# ---------------------------------------------------------------------------
evaluation:
  num_rollouts: 50
  max_timesteps: 400
  success_distance_threshold: 0.03
  temporal_agg: false       # set true to use temporal action aggregation
  onscreen_render: false    # set true to enable viewer during eval
  render_video: true
  video_camera: isometric
  video_seconds: 30
  video_fps: 30
  video_width: 1920
  video_height: 1080
